<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Sistema Escolar POO</title>
</head>
<body>
    <div class="container">
        <h2>Registro de Aluno</h2>
        
        <div class="photo-section">
            <img id="preview" src="https://placehold.co/400" alt="Foto">
            <label for="foto" class="btn-upload">Selecionar Foto</label>
            <input type="file" id="foto" accept="image/*" style="display: none;">
        </div>

        <div class="input-group">
            <label>Nome do Aluno</label>
            <input type="text" id="nome" placeholder="Nome Completo">
        </div>

        <div class="input-group">
            <label>Matrícula</label>
            <input type="text" id="matricula" placeholder="Ex: 2026123">
        </div>

        <label>Notas Bimestrais</label>
        <div class="grades-grid">
            <input type="number" class="nota" placeholder="N1" min="0" max="10">
            <input type="number" class="nota" placeholder="N2" min="0" max="10">
            <input type="number" class="nota" placeholder="N3" min="0" max="10">
            <input type="number" class="nota" placeholder="N4" min="0" max="10">
        </div>

        <div class="actions">
            <button id="btnCalcular">Calcular Média</button>
            <button class="btn-secondary" onclick="location.reload()">Novo Aluno (Factory)</button>
        </div>

        <div id="status" style="display: none;"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
