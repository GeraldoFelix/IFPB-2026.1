<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Web - Compra de Ingressos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Compra de Ingressos</h1>
        
        <div class="form-group">
            <label for="cliente">Nome do Cliente:</label>
            <input type="text" id="cliente" placeholder="Digite seu nome">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="Digite seu cpf EX: 999.888.666-07">
        </div>

        <div class="form-group">
            <label for="filme">Escolha o Filme:</label>
            <select id="filme">
                <option value="Batman: O Cavaleiro das Trevas">Batman: O Cavaleiro das Trevas</option>
                <option value="Joker">Joker</option>
                <option value="Joker: Delírio a Dois">Joker: Delírio a Dois</option>
                <option value="1917">1917</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tipoIngresso">Tipo de Ingresso:</label>
            <select id="tipoIngresso">
                <option value="Inteira">Inteira</option>
                <option value="Meia">Meia-Entrada</option>
                <option value="VIP">VIP</option>
            </select>
        </div>

        <div class="form-group">
            <label for="seccao">Escolha a Secção:</label>
            <select id="seccao">
                <option value="1">Secção 1</option>
                <option value="2">Secção 2</option>
                <option value="3">Secção 3</option>
                <option value="4">Secção 4</option>
            </select>
        </div>

        <div class="seats-container">
            <h3>Selecione seu Assento (Secção <span id="current-section">1</span>)</h3>
            <div id="seats-grid" class="seats-grid">
                </div>
        </div>

        <div class="actions">
            <button id="btn-finalizar" class="btn-primary">Finalizar Compra</button>
            <button id="btn-novo" class="btn-outline">Novo Ingresso</button>
        </div>

        <div id="mensagem" class="msg"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
